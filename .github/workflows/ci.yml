name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proofgrid
          POSTGRES_PASSWORD: proofgrid_ci
          POSTGRES_DB: proofgrid
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U proofgrid" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://proofgrid:proofgrid_ci@127.0.0.1:5432/proofgrid
      DATABASE_DIRECT_URL: postgresql://proofgrid:proofgrid_ci@127.0.0.1:5432/proofgrid
      TEST_DATABASE_URL: postgresql://proofgrid:proofgrid_ci@127.0.0.1:5432/proofgrid
      AI_PROVIDER: fixture
      ACQUISITION_MODE: FIXTURE
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --frozen --extra dev

      - name: Backend Lint (Ruff)
        run: |
          cd backend
          .venv/bin/ruff check app worker tests
          .venv/bin/ruff format --check app worker tests

      - name: Backend Typecheck (mypy)
        run: |
          cd backend
          .venv/bin/mypy app worker tests

      - name: Backend Tests (pytest)
        run: |
          cd backend
          .venv/bin/pytest

      - name: PostgreSQL and offline fixture E2E
        run: |
          cd backend
          .venv/bin/alembic upgrade head
          .venv/bin/pytest -m integration

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Frontend Lint
        run: pnpm --filter @proofgrid/web lint

      - name: Frontend Typecheck
        run: pnpm --filter @proofgrid/web typecheck

      - name: Frontend Tests
        run: pnpm --filter @proofgrid/web test

      - name: Frontend Production Build
        run: pnpm --filter @proofgrid/web build
