name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          cd backend
          uv venv
          uv pip install -e ".[dev]"

      - name: Backend Lint (Ruff)
        run: |
          cd backend
          .venv/bin/ruff check app worker tests
          .venv/bin/ruff format --check app worker tests

      - name: Backend Typecheck (mypy)
        run: |
          cd backend
          .venv/bin/mypy app worker tests

      - name: Backend Tests (pytest)
        run: |
          cd backend
          .venv/bin/pytest

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Frontend Lint
        run: pnpm --filter @proofgrid/web lint

      - name: Frontend Typecheck
        run: pnpm --filter @proofgrid/web typecheck

      - name: Frontend Tests
        run: pnpm --filter @proofgrid/web test

      - name: Frontend Production Build
        run: pnpm --filter @proofgrid/web build
