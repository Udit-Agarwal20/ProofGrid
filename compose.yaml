services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proofgrid
      POSTGRES_PASSWORD: proofgrid_local
      POSTGRES_DB: proofgrid
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofgrid -d proofgrid"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Disposable local verification database; authoritative deployments use Neon.
    tmpfs:
      - /var/lib/postgresql/data
